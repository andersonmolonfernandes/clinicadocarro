<?xml version="1.0" encoding="utf-8"?>
<!-- Simplified mask icon for Safari pinning. This is a monochrome SVG that will be tinted using the mask-icon color (#00e676) in the head. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Clínica do Carro">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#76ff03" />
      <stop offset="1" stop-color="#00e676" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="18" fill="black" />
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#g)" stroke-width="6" />
  <!-- stylized C letter to hint the brand; keep it simple so it works as a mask -->
  <path d="M36 36 C36 28, 64 28, 64 36 C64 44, 36 44, 36 56 C36 68, 64 68, 64 56" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
