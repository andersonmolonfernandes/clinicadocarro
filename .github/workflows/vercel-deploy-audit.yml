name: Auditoria + Deploy Vercel

# Confirma que o último commit do GitHub está na branch de Production da Vercel
# ANTES de gerar um novo deploy. Se a auditoria falhar, o deploy não acontece.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  auditoria:
    name: Auditoria de branch e commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar secrets obrigatórios
        run: |
          set -euo pipefail
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Secret $v não configurado no repositório."
              exit 1
            fi
          done
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Identificar último commit
        id: commit
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          BRANCH="${GITHUB_REF_NAME}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Commit: $SHA"
          echo "Branch: $BRANCH"

      - name: Confirmar branch de Production da Vercel
        id: audit
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_BRANCH: ${{ steps.commit.outputs.branch }}
          GH_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail

          PROJECT_JSON="$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"

          PROD_BRANCH="$(echo "$PROJECT_JSON" | jq -r '.link.productionBranch // .link.gitCredentialId // empty')"
          REPO_TYPE="$(echo "$PROJECT_JSON" | jq -r '.link.type // "não vinculado"')"
          REPO_NAME="$(echo "$PROJECT_JSON" | jq -r '(.link.org // "") + "/" + (.link.repo // "")')"

          if [ -z "$PROD_BRANCH" ] || [ "$PROD_BRANCH" = "null" ]; then
            # productionBranch vazio na Vercel = usa a branch default do repositório
            PROD_BRANCH="${{ github.event.repository.default_branch }}"
            echo "Vercel sem productionBranch explícito; assumindo branch default: $PROD_BRANCH"
          fi

          echo "Repositório vinculado na Vercel: $REPO_TYPE $REPO_NAME"
          echo "Branch de Production na Vercel: $PROD_BRANCH"
          echo "Branch deste workflow: $GH_BRANCH"

          if [ "$PROD_BRANCH" != "$GH_BRANCH" ]; then
            echo "::error::Auditoria reprovada: a branch '$GH_BRANCH' não é a branch de Production da Vercel ('$PROD_BRANCH'). Deploy cancelado."
            exit 1
          fi

          # Confirma que o commit realmente está na ponta da branch remota
          REMOTE_SHA="$(git rev-parse "origin/$GH_BRANCH")"
          if [ "$REMOTE_SHA" != "$GH_SHA" ]; then
            echo "::error::Auditoria reprovada: origin/$GH_BRANCH está em $REMOTE_SHA, mas o workflow roda em $GH_SHA. Existe commit mais novo — refaça o deploy a partir dele."
            exit 1
          fi

          echo "Auditoria aprovada: commit $GH_SHA é a ponta de '$GH_BRANCH' e essa é a branch de Production da Vercel."
          {
            echo "### Auditoria de deploy aprovada"
            echo ""
            echo "- Commit: \`$GH_SHA\`"
            echo "- Branch: \`$GH_BRANCH\`"
            echo "- Branch de Production na Vercel: \`$PROD_BRANCH\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy de produção (Vercel)
    needs: auditoria
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Vercel CLI
        run: npm i -g vercel@latest

      - name: Build e deploy sem cache
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --force --token="$VERCEL_TOKEN"
          URL="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "Deploy: $URL"
          echo "- Deploy: $URL" >> "$GITHUB_STEP_SUMMARY"
